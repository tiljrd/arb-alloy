[package]
name = "arb-alloy-network"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["tiljrd"]
description = "Arbitrum-specific network marker and RPC type bindings for Alloy; used by reth."
repository = "https://github.com/tiljrd/arb-alloy"
homepage = "https://github.com/tiljrd/arb-alloy"
documentation = "https://docs.rs/arb-alloy-network"
readme = "README.md"
keywords = ["arbitrum", "ethereum", "alloy", "reth", "rpc"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
alloy-network = "1.0.24"
alloy-consensus = "1.0.24"
alloy-rpc-types-eth = "1.0.24"
alloy-primitives = "1.3.0"
