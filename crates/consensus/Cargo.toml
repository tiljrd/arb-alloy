[package]
name = "arb-alloy-consensus"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Arbitrum-specific consensus primitives on top of alloy: tx envelopes, receipt variants, and RLP encode/decode used by arb-reth."
repository = "https://github.com/tiljrd/arb-alloy"
homepage = "https://github.com/tiljrd/arb-alloy"
documentation = "https://docs.rs/arb-alloy-consensus"
readme = "README.md"
keywords = ["arbitrum", "ethereum", "alloy", "primitives", "rlp"]
categories = ["cryptography::cryptocurrencies", "encoding", "no-std"]

[features]
default = ["alloc"]
alloc = []

[dependencies]
alloy-rlp = { version = "0.3", default-features = false, features = ["derive"] }
alloy-primitives = { version = "1.3", default-features = false, features = ["rlp"] }
thiserror = "2"

[dev-dependencies]
proptest = "1.4.0"
hex = "0.4"
